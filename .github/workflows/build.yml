
name: Build Phantom Ghost

on:
  workflow_dispatch:
  push:
    paths:
      - "PhantomRemastered-Ghost-source-fixed.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extract Phantom source
        run: |
          mkdir project
          unzip -q PhantomRemastered-Ghost-source-fixed.zip -d project

      - name: Build Fabric JAR
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Phantom-Ghost-JAR
          path: project/build/libs/*.jar
concurrency:
